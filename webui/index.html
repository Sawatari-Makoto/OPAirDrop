<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>OPAirDrop</title>
<script>
/* Apply the dark theme before the first paint. The theme class is normally
   toggled by the app bundle, but that bundle is fetched and parsed after the
   document is painted, so the page would first render in the light palette
   and then flip over in dark mode. Doing it here keeps the first frame in
   the theme the system asks for. */
(function () {
  try {
    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.documentElement.classList.add('m-theme-dark');
    }
  } catch (e) {}
})();
</script>
<style>
/* Critical styles: paint the themed background on the root element, which
   propagates to the canvas. Without them the view shows the default white
   canvas until the external stylesheet arrives. */
html { background: #f7f7f7; }
html.m-theme-dark { background: #000; }
body { background: #f7f7f7; }
html.m-theme-dark body { background: #000; }
</style>
</head>
<body><div id="app"></div><script type="module" src="/src/main.ts"></script></body>
</html>
